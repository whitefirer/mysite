    <script src="https://fastly.jsdelivr.net/npm/jquery@3.1.1/dist/jquery.slim.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>

    <script src="https://fastly.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <script src="https://fastly.jsdelivr.net/pyodide/v0.23.0/full/pyodide.js"></script>
    <script>
        $(function () {
            // Custom theme to match style of xterm.js logo
            var baseTheme = {
                foreground: '#F8F8F8',
                background: '#2D2E2C',
                cursorAccent: '#2D2E2C',
                selection: '#5DA5D533',
                black: '#1E1E1D',
                brightBlack: '#262625',
                red: '#CE5C5C',
                brightRed: '#FF7272',
                green: '#5BCC5B',
                brightGreen: '#72FF72',
                yellow: '#CCCC5B',
                brightYellow: '#FFFF72',
                blue: '#5D5DD3',
                brightBlue: '#7279FF',
                magenta: '#BC5ED1',
                brightMagenta: '#E572FF',
                cyan: '#5DA5D5',
                brightCyan: '#72F0FF',
                white: '#F8F8F8',
                brightWhite: '#FFFFFF'
            };
            // vscode-snazzy https://github.com/Tyriar/vscode-snazzy
            var otherTheme = {
                foreground: '#eff0eb',
                background: '#282a36',
                cursorAccent: '#282a36',
                selection: '#97979b33',
                black: '#282a36',
                brightBlack: '#686868',
                red: '#ff5c57',
                brightRed: '#ff5c57',
                green: '#5af78e',
                brightGreen: '#5af78e',
                yellow: '#f3f99d',
                brightYellow: '#f3f99d',
                blue: '#57c7ff',
                brightBlue: '#57c7ff',
                magenta: '#ff6ac1',
                brightMagenta: '#ff6ac1',
                cyan: '#9aedfe',
                brightCyan: '#9aedfe',
                white: '#f1f1f0',
                brightWhite: '#eff0eb'
            };

            const ESC = '\u001b';
            const CTRL_C = '\u0003';
            const ENTER = '\r';
            const DEL = '\u007F';
            const VK_UP = '\x1b[A';
            const VK_DOWN = '\x1b[B';
            const VK_RIGHT = '\x1b[C';
            const VK_LEFT = '\x1b[D';

            var isBaseTheme = true;
            var isGameStart = false;
            var gameName = "";
            var gameArgs = [];
            var autoFlag = false;
            var changed = false;
            var gameKey = null;
            var consoleKey = null;
            var matrixDropInfoList = [];
            var matrixTheme = "green";
            var matrixDirection = "DOWN";
            var matrixFlag = 1;
            var matrixCols = 24;
            var matrixRows = 80;
            var streamString = "";
            var cmdX = 0;
            var cmdY = 0;
            var welcomeTips = [
                [..."Welcome to my blog"],
                [..."从云原生到 AI 工程化"],
                [..."Cloud Native × AI Engineering"],
                [..."难 度 即 价 值 所 在"],
            ]

            var term = new window.Terminal({
                fontFamily: '"Cascadia Code", Menlo, monospace',
                theme: baseTheme,
                cursorBlink: true,
                linkHandler: {
                    // bypass xterm's default confirm() dialog for OSC8 links
                    activate: (event, text) => window.open(text, '_blank'),
                },
            });
            term.open(document.querySelector('.demo .inner'));
            var isWebglEnabled = false;
            try {
                const webgl = new window.WebglAddon();
                term.loadAddon(webgl);
                var wl = new WebLinksAddon();
                term.loadAddon(wl);
                term.registerLinkProvider({provideLinks:function(n,c){
                    var l=term.buffer.active.getLine(n);
                    if(!l||l.isWrapped){c(void 0);return;}
                    var t=l.translateToString(!0),i=t.indexOf('whitefirer');
                    if(i===-1){c(void 0);return;}
                    c([{range:{start:{x:i,y:n},end:{x:i+10,y:n}},text:'whitefirer',
                        activate:function(){window.open('https://github.com/whitefirer','_blank');}}]);
                }});
                isWebglEnabled = true;
            } catch (e) {
                console.warn('WebGL addon threw an exception during load', e);
            }


            var pyodide = null;
            var stdout_codes = [];
            function rawstdout(code) {
                stdout_codes.push(code);
            }

            function pythonTerm() {
                term.write('\r\x1b[01;32m>>> ');
                term.write('\x1b[!p')
            }

            async function startPyodide() {
                term.write('Starting Python...');
                pyodide = await loadPyodide();
                await pyodide.loadPackage("pygments")

                pyodide.runPythonAsync(`
                        import sys
                        from pygments import highlight
                        from pygments.lexers import PythonLexer
                        from pygments.formatters import TerminalTrueColorFormatter
                        sys.version + " (https://whitefirer.org)"
                    `).then(output => {
                    term.write('\rPython ' + output + '\r\n');
                    pythonTerm();
                });

                pyodide.setStdout({ raw: rawstdout, isatty: true });
            }

            var pythonCode = '';
            var pythonCodeX = 0;
            var pythonCodeY = 0;
            var historyCodeList = [];
            var lastPythonCodeLine = "";
            var blockFlag = "";
            var blockMap = {
                ":": "\r",
                "\\": "\r",
                "{": "}",
                "[": "]",
                "(": ")",
            }

            var historyIndex = 0;
            var historyCode = "";
            var lastCRIndex = 0;
            var renderingCode = false;
            function setCursorPosition(x, y) {
                term.write(`\x1b[${y};${x}H`)
            }

            async function writeHightPythonCode(x, y, pythonCode) {
                // term.write(e);
                setCursorPosition(x, y);
                await pyodide.runPythonAsync(`
                _PY_code = """
                ${pythonCode.replaceAll("\\", "\\\\")}
                """
                _PY_highlighted_code = highlight(_PY_code, PythonLexer(), TerminalTrueColorFormatter(style='native'));
                _PY_highlighted_code[:-1]
            `).then(output => {
                    term.write(output.replaceAll('\n', '\r\n... '))
                })
            }

            function earseCureentLinePythonCode() {
                if (pythonCodeY === (term.buffer.active.cursorY + term.buffer.active.baseY + 1)) {
                    term.write('\r\x1b[2K\x1b[01;32m>>> ');
                } else if (term.buffer.active.cursorX > 4) {
                    term.write('\r\x1b[2K... ');
                } else {
                    term.write('\r\x1b[2K');
                }
            }

            function OnPythonTermOnData(e) {
                const printable = !e.altKey && !e.ctrlKey && !e.metaKey;
                switch (e) {
                    case VK_LEFT:
                        if (term.buffer.active.cursorX > 4) {
                            setCursorPosition(term.buffer.active.cursorX, term.buffer.active.cursorY + 1);
                        }
                        break;
                    case VK_RIGHT:
                        lastCRIndex = pythonCode.lastIndexOf('\r');
                        lastPythonCodeLine = pythonCode.substring(lastCRIndex + 1, pythonCode.length + 1);
                        if (term.buffer.active.cursorX < (lastPythonCodeLine.length % term.cols + 4)) {
                            setCursorPosition(term.buffer.active.cursorX + 2, term.buffer.active.cursorY + 1);
                        }
                        break;
                    case VK_UP:
                        if (historyCodeList.length === 0) {
                            break;
                        }
                        if (pythonCode.length === 0) {
                            pythonCodeX = term.buffer.active.cursorX + 1;
                            pythonCodeY = term.buffer.active.cursorY + term.buffer.active.baseY + 1;
                        }
                        historyCode = "";
                        historyIndex += 1;
                        if (historyIndex > (historyCodeList.length + 1)) {
                            historyIndex = historyCodeList.length + 1;
                        } else if (historyIndex != (historyCodeList.length + 1)) {
                            historyCode = historyCodeList[historyCodeList.length - historyIndex]
                        }
                        earseCureentLinePythonCode();
                        lastCRIndex = pythonCode.lastIndexOf('\r');
                        pythonCode = pythonCode.substring(0, lastCRIndex + 1) + historyCode;
                        if (historyCode.length > 0) {
                            writeHightPythonCode(5, pythonCodeY - term.buffer.active.baseY, pythonCode)
                        }
                        break;
                    case VK_DOWN:
                        if (historyCodeList.length === 0) {
                            break;
                        }
                        if (pythonCode.length === 0) {
                            pythonCodeX = term.buffer.active.cursorX + 1;
                            pythonCodeY = term.buffer.active.cursorY + term.buffer.active.baseY + 1;
                        }
                        historyCode = "";
                        historyIndex -= 1;
                        if (historyIndex < 0) {
                            historyIndex = 0;
                        } else if (historyIndex === 0) {
                            historyCode = lastPythonCodeLine;
                        }
                        else {
                            historyCode = historyCodeList[historyCodeList.length - historyIndex]
                        }
                        earseCureentLinePythonCode();
                        lastCRIndex = pythonCode.lastIndexOf('\r');
                        pythonCode = pythonCode.substring(0, lastCRIndex + 1) + historyCode;
                        if (historyCode.length > 0) {
                            writeHightPythonCode(5, pythonCodeY - term.buffer.active.baseY, pythonCode)
                        }
                        break;
                    case ENTER:
                        if (pythonCode.length > 0) {
                            if (pythonCode.startsWith('exit(')) {
                                isGameStart = false;
                                pythonCode = '';
                                gameKey = null;
                                gameName = "";
                                pyodide = null;
                                term.writeln("\r");
                                term.prompt();
                                return;
                            }
                            historyIndex = 0;
                            let pythonCodeList = pythonCode.split('\r');
                            let lastLine = pythonCodeList[pythonCodeList.length - 1];
                            if (lastLine.length > 0) {
                                historyCodeList = historyCodeList.concat(lastLine)
                            }
                            if (((pythonCode[pythonCode.length - 1] in blockMap)) && (blockFlag === "")) {
                                blockFlag = pythonCode[pythonCode.length - 1];
                                pythonCode += e;
                                term.writeln("\r");
                                term.write('... ');
                                break;
                            }
                            if (blockFlag != "") {
                                if (pythonCode[pythonCode.length - 1] === blockMap[blockFlag]) {
                                    blockFlag = "";
                                } else {
                                    pythonCode += e;
                                    term.writeln("\r");
                                    term.write('... ');
                                    break;
                                }
                            }
                            term.writeln('\x1b[0m');

                            stdout_codes = []
                            pyodide.runPythonAsync(pythonCode).then(output => {
                                let result = new TextDecoder().decode(new Uint8Array(stdout_codes));
                                if (result.length > 0) {
                                    term.write(result.replaceAll("\n", "\r\n"));
                                } else if (output != undefined) {
                                    term.write(output + '\n');
                                }
                                pythonTerm();
                            }).catch(err => {
                                // term.write('\x1b[01;31m' + err.message.replaceAll('\n', '\r\n') + '\x1b[0m');
                                pythonCode = ""
                                pyodide.runPythonAsync(`
                                _PY_code = """
                                ${err.message.replaceAll('\n', '\r')}
                                """
                                _PY_highlighted_code = highlight(_PY_code, PythonLexer(), TerminalTrueColorFormatter(style='one-dark'));
                                _PY_highlighted_code[:-1]
                            `).then(output => {
                                    term.write(output.replaceAll('\n', '\r\n') + '\n')
                                    pythonTerm();
                                })
                            });

                        } else {
                            term.writeln('\x1b[0m');
                            pythonTerm();
                        }
                        pythonCode = '';
                        break;
                    case DEL:
                        lastCRIndex = pythonCode.lastIndexOf('\r');
                        lastPythonCodeLine = pythonCode.substring(lastCRIndex + 1, pythonCode.length + 1);
                        if (term.buffer.active.cursorX > 4 || lastPythonCodeLine.length >= term.cols - 4) {
                            let currentCursorY = term.buffer.active.cursorY + term.buffer.active.baseY + 1;
                            let lasetEditIndex = term.buffer.active.cursorX - 4;
                            let editIndex = lasetEditIndex;
                            if (lastPythonCodeLine.length >= term.cols - 4) {
                                editIndex = lasetEditIndex + (currentCursorY - pythonCodeY) * term.cols
                            }
                            pythonCode = pythonCode.substring(0, lastCRIndex + 1) + lastPythonCodeLine.slice(0, editIndex - 1) + lastPythonCodeLine.slice(editIndex);
                            term.write('\x1b[?25l');
                            earseCureentLinePythonCode();
                            writeHightPythonCode(pythonCodeX, pythonCodeY - term.buffer.active.baseY, pythonCode).then(() => {
                                if (lastPythonCodeLine.length === term.cols - 4) {
                                    setCursorPosition(term.cols, currentCursorY - term.buffer.active.baseY - 1);
                                } else {
                                    setCursorPosition(lasetEditIndex + 4, currentCursorY - term.buffer.active.baseY);
                                }
                                term.write('\x1b[?25h'); // Show cursor
                            });
                        }

                        break;
                    default:
                        if (printable) {
                            if (e >= String.fromCharCode(0x20) && e <= String.fromCharCode(0x7E) || e >= '\u00a0') {
                                if (renderingCode === true) {
                                    break;
                                }
                                renderingCode = true;
                                if (pythonCode.length === 0) {
                                    pythonCodeX = term.buffer.active.cursorX + 1;
                                    pythonCodeY = term.buffer.active.cursorY + term.buffer.active.baseY + 1;
                                }
                                let currentCursorY = term.buffer.active.cursorY + term.buffer.active.baseY + 1;
                                lastCRIndex = pythonCode.lastIndexOf('\r');
                                let lasetEditIndex = term.buffer.active.cursorX - 4;
                                let editIndex = lasetEditIndex;
                                lastPythonCodeLine = pythonCode.substring(lastCRIndex + 1, pythonCode.length + 1);
                                if (lastPythonCodeLine.length >= term.cols - 4) {
                                    editIndex = lasetEditIndex + (currentCursorY - pythonCodeY) * term.cols;
                                }
                                lastPythonCodeLine = lastPythonCodeLine.slice(0, editIndex) + e + lastPythonCodeLine.slice(editIndex)
                                pythonCode = pythonCode.substring(0, lastCRIndex + 1) + lastPythonCodeLine;
                                term.write('\x1b[?25l');
                                writeHightPythonCode(pythonCodeX, pythonCodeY - term.buffer.active.baseY, pythonCode).then(() => {
                                    if ((lasetEditIndex + 6) > term.cols) {
                                        setCursorPosition(0, currentCursorY - term.buffer.active.baseY + 1);
                                    } else {
                                        setCursorPosition(lasetEditIndex + 6, currentCursorY - term.buffer.active.baseY);
                                    }
                                    term.write('\x1b[?25h'); // Show cursor
                                    renderingCode = false;
                                });
                            }
                        }
                }
            }
            // Cancel wheel events from scrolling the page if the terminal has scrollback
            document.querySelector('.xterm').addEventListener('wheel', e => {
                if (term.buffer.active.baseY > 0) {
                    e.preventDefault();
                }
            });

            function runFakeTerminal() {
                if (term._initialized) {
                    return;
                }

                term._initialized = true;

                term.prompt = () => {
                    term.write('\x1b[01;32m➜ \x1b[0m');
                };

                // TODO: Use a nicer default font
                initConsole();
                // addDecoration(term);

                setTimeout(() => {
                    if (consoleKey === null) {
                        setTimeout(function () {
                            term.write('c');
                        }, 100)
                        setTimeout(function () {
                            term.write('h');
                        }, 200)
                        setTimeout(function () {
                            term.write('a');
                        }, 300)
                        setTimeout(function () {
                            term.write('r');
                        }, 400)
                        setTimeout(function () {
                            term.write('a');
                        }, 500)
                        setTimeout(function () {
                            term.write('i');
                        }, 600)
                        setTimeout(function () {
                            term.write('n');
                        }, 700)
                        setTimeout(function () {
                            startGame("charain");
                            autoFlag = true;
                        }, 800)
                    }
                }, 600000)

                term.onData(e => {
                    consoleKey = e;
                    if (isGameStart) {
                        if (gameName == 'python') {
                            OnPythonTermOnData(e);
                        } else {
                            onGameData(e);
                        }
                        return
                    }
                    if (needleBusy) {
                        // model is routing the previous input; ignore keystrokes
                        return;
                    }
                    switch (e) {
                        case ESC: // ESC
                            term.prompt()
                            break;
                        case CTRL_C: // Ctrl+C
                            term.write('^C\n\r');
                            term.prompt()
                            break;
                        case ENTER: // Enter
                            runCommand(term, command);
                            command = '';
                            cmdCursor = 0;
                            break;
                        case VK_LEFT:
                            moveCmdCursorLeft();
                            break;
                        case VK_RIGHT:
                            moveCmdCursorRight();
                            break;
                        case DEL: // Backspace (DEL)
                            deleteCmdChar();
                            break;
                        default: // Print all other characters for demo
                            if (e >= String.fromCharCode(0x20) && e <= String.fromCharCode(0x7E) || e >= '\u00a0') {
                                insertCmdText(e);
                            }
                    }
                });

                // Create a very simple link provider which hardcodes links for certain lines
                term.registerLinkProvider({
                    provideLinks(bufferLineNumber, callback) {
                        switch (bufferLineNumber) {
                            case 2:
                                callback([
                                    {
                                        text: 'Blog',
                                        range: { start: { x: 28, y: 2 }, end: { x: 31, y: 2 } },
                                        activate() {
                                            window.open('https://whitefirer.org', '_blank');
                                        }
                                    },
                                    {
                                        text: 'GitHub',
                                        range: { start: { x: 34, y: 2 }, end: { x: 39, y: 2 } },
                                        activate() {
                                            window.open('https://github.com/whitefirer', '_blank');
                                        }
                                    },
                                ]);
                                return;
                        }
                        callback(undefined);
                    }
                });
            }

            // ---------- blog search + Needle on-device AI (site override) ----------
            var blogPosts = [];
            var lastResults = [];
            var needleWorker = null;
            var needleBusy = false;

            var NEEDLE_TOOLS_JSON = JSON.stringify([
                {
                    name: 'search_posts',
                    description: 'Search blog posts by keyword or topic',
                    parameters: { query: { type: 'string' } }
                },
                {
                    name: 'list_recent_posts',
                    description: 'List the most recent blog posts',
                    parameters: {}
                },
                {
                    name: 'list_posts_by_tag',
                    description: 'List blog posts that have a specific tag',
                    parameters: { tag: { type: 'string' } }
                }
            ]);

            // /index.json chunks each post into several entries (objectID with
            // ":N:M" suffixes) for lunr snippets — deduplicate by uri, keeping
            // the first chunk which holds the leading content
            fetch('/index.json').then(r => r.json()).then(raw => {
                const byUri = new Map();
                for (const p of raw) {
                    if (!byUri.has(p.uri)) byUri.set(p.uri, p);
                }
                blogPosts = [...byUri.values()];
                blogPosts.sort((a, b) => (a.date < b.date ? 1 : -1));
            }).catch(() => {});

            function scorePost(p, terms) {
                const hay = {
                    title: (p.title || '').toLowerCase(),
                    tags: (p.tags || []).join(' ').toLowerCase(),
                    cats: (p.categories || []).join(' ').toLowerCase(),
                    content: (p.content || '').toLowerCase()
                };
                let score = 0;
                for (const t of terms) {
                    if (hay.title.includes(t)) score += 10;
                    if (hay.tags.includes(t)) score += 8;
                    if (hay.cats.includes(t)) score += 6;
                    if (hay.content.includes(t)) score += 2;
                }
                return score;
            }

            function searchPosts(query) {
                const q = query.toLowerCase().trim();
                if (!q) return [];
                // whitespace terms for latin, plus the raw string as one term for CJK
                const terms = q.split(/\s+/).filter(Boolean);
                // extract latin/digit runs too, so CJK-wrapped keywords like
                // 找一下deepseek的文章 still match as "deepseek"
                for (const m of q.matchAll(/[a-z0-9][a-z0-9._+-]*/g)) {
                    if (!terms.includes(m[0])) terms.push(m[0]);
                }
                if (!terms.includes(q)) terms.push(q);
                return blogPosts
                    .map(p => ({ p, s: scorePost(p, terms) }))
                    .filter(x => x.s > 0)
                    .sort((a, b) => b.s - a.s)
                    .slice(0, 8)
                    .map(x => x.p);
            }

            function printPosts(list) {
                lastResults = list;
                if (!list.length) {
                    term.writeln('没有匹配的文章。换个关键词试试？');
                    return;
                }
                list.forEach((p, i) => {
                    // OSC 8 hyperlink: title itself is clickable
                    const link = `\x1b]8;;${location.origin + p.uri}\x07\x1b[1;36m${p.title}\x1b[0m\x1b]8;;\x07`;
                    term.writeln(`  \x1b[1;33m[${i + 1}]\x1b[0m ${link}`);
                    term.writeln(`      \x1b[2m${p.date}  ${(p.tags || []).join(', ')}\x1b[0m`);
                });
                term.writeln('\x1b[2m输入 open <序号> 打开对应文章\x1b[0m');
            }

            // inference runs in a module worker so the UI stays responsive
            function getNeedleWorker() {
                if (!needleWorker) {
                    needleWorker = new Worker('/lib/needle-rs/worker.js', { type: 'module' });
                }
                return needleWorker;
            }

            function execBlogTool(name, args, rawInput) {
                switch (name) {
                    case 'search_posts': {
                        const q = args.query || '';
                        term.writeln(`\x1b[2m$ search_posts("${q}")\x1b[0m`);
                        let results = searchPosts(q);
                        // the model can garble pure-CJK queries — retry with the
                        // original user input when its extraction found nothing
                        if (!results.length && rawInput && rawInput !== q) {
                            term.writeln(`\x1b[2m$ search_posts("${rawInput}") (retry)\x1b[0m`);
                            results = searchPosts(rawInput);
                        }
                        if (!results.length && /最近|最新|recent|latest|new/i.test(rawInput || q)) {
                            term.writeln('\x1b[2m$ list_recent_posts() (fallback)\x1b[0m');
                            results = blogPosts.slice(0, 8);
                        }
                        printPosts(results);
                        break;
                    }
                    case 'list_recent_posts':
                        term.writeln('\x1b[2m$ list_recent_posts()\x1b[0m');
                        printPosts(blogPosts.slice(0, 8));
                        break;
                    case 'list_posts_by_tag':
                        term.writeln(`\x1b[2m$ list_posts_by_tag("${args.tag || ''}")\x1b[0m`);
                        printPosts(blogPosts.filter(p => (p.tags || []).includes(args.tag)).slice(0, 8));
                        break;
                    default:
                        throw new Error('unknown tool: ' + name);
                }
            }

            function needleRoute(input) {
                needleBusy = true;
                const worker = getNeedleWorker();
                const started = performance.now();
                // animated spinner on a self-overwriting line until the first token
                const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
                let fi = 0, firstToken = false, line = '', status = 'thinking';
                const drawSpin = () => term.write(`\r\x1b[2K\x1b[2m${frames[fi]} ${status}\x1b[0m`);
                drawSpin();
                const spin = setInterval(() => {
                    if (firstToken) return;
                    fi = (fi + 1) % frames.length;
                    drawSpin();
                }, 80);

                const finish = (fn) => {
                    clearInterval(spin);
                    term.write('\r\x1b[2K');
                    try {
                        fn();
                    } finally {
                        needleBusy = false;
                        term.prompt();
                    }
                };

                worker.onerror = (ev) => finish(() => {
                    term.writeln(`\x1b[2m[needle] worker 错误（${ev.message}），按关键词搜索处理\x1b[0m`);
                    printPosts(searchPosts(input));
                });

                worker.onmessage = (ev) => {
                    const msg = ev.data;
                    if (msg.type === 'progress') {
                        status = msg.message;
                    } else if (msg.type === 'token') {
                        firstToken = true;
                        line += msg.piece;
                        const shown = line.length > 60 ? '…' + line.slice(-59) : line;
                        term.write('\r\x1b[2K\x1b[2m' + shown + '\x1b[0m');
                    } else if (msg.type === 'done') {
                        finish(() => {
                            term.writeln(`\x1b[2m[needle] ${(performance.now() - started).toFixed(0)}ms\x1b[0m`);
                            // the 26M model emits truncated CJK unicode escapes —
                            // strip malformed escapes before parsing (valid ones are kept)
                            const sanitized = msg.out.replace(/\\u[0-9a-fA-F]{0,3}(?![0-9a-fA-F])/g, '');
                            const calls = JSON.parse(sanitized);
                            if (!Array.isArray(calls) || !calls.length) throw new Error('empty tool call');
                            for (const c of calls) execBlogTool(c.name, c.arguments || {}, input);
                        });
                    } else if (msg.type === 'error') {
                        finish(() => {
                            term.writeln(`\x1b[2m[needle] 解析失败（${msg.message}），按关键词搜索处理\x1b[0m`);
                            printPosts(searchPosts(input));
                        });
                    }
                };
                worker.postMessage({ query: input, tools: NEEDLE_TOOLS_JSON });
            }

            var command = '';
            var cmdCursor = 0;

            // terminal cell width of a char (wide CJK = 2, else 1)
            function cellWidth(ch) {
                const code = ch.codePointAt(0);
                return (code >= 0x1100 && (
                    code <= 0x115f || code === 0x2329 || code === 0x232a ||
                    (code >= 0x2e80 && code <= 0xa4cf && code !== 0x303f) ||
                    (code >= 0xac00 && code <= 0xd7a3) ||
                    (code >= 0xf900 && code <= 0xfaff) ||
                    (code >= 0xfe30 && code <= 0xfe4f) ||
                    (code >= 0xff00 && code <= 0xff60) ||
                    (code >= 0xffe0 && code <= 0xffe6) ||
                    (code >= 0x20000 && code <= 0x3fffd))) ? 2 : 1;
            }

            function textWidth(str) {
                let w = 0;
                for (const c of str) w += cellWidth(c);
                return w;
            }

            function moveCmdCursorLeft() {
                if (cmdCursor > 0) {
                    cmdCursor--;
                    term.write('\x1b[' + cellWidth(command[cmdCursor]) + 'D');
                }
            }

            function moveCmdCursorRight() {
                if (cmdCursor < command.length) {
                    term.write('\x1b[' + cellWidth(command[cmdCursor]) + 'C');
                    cmdCursor++;
                }
            }

            function insertCmdText(text) {
                command = command.slice(0, cmdCursor) + text + command.slice(cmdCursor);
                cmdCursor += text.length;
                const rest = command.slice(cmdCursor);
                if (rest.length === 0) {
                    term.write(text);
                } else {
                    // insert mid-line: rewrite the tail, then move cursor back
                    term.write(text + rest + '\x1b[' + textWidth(rest) + 'D');
                }
            }

            function deleteCmdChar() {
                if (cmdCursor <= 0) return;
                const removed = command[cmdCursor - 1];
                const w = cellWidth(removed);
                command = command.slice(0, cmdCursor - 1) + command.slice(cmdCursor);
                cmdCursor--;
                const rest = command.slice(cmdCursor);
                if (rest.length === 0) {
                    term.write('\x1b[' + w + 'D' + ' '.repeat(w) + '\x1b[' + w + 'D');
                } else {
                    // delete mid-line: rewrite the tail + one blank, move back
                    term.write('\x1b[' + w + 'D' + rest + ' ' + '\x1b[' + (textWidth(rest) + 1) + 'D');
                }
            }

            function getRainbowColor(freq, i) {
                const red = Math.round(Math.sin(freq * i + 0) * 127 + 128);
                const green = Math.round(Math.sin(freq * i + 2 * Math.PI / 3) * 127 + 128);
                const blue = Math.round(Math.sin(freq * i + 4 * Math.PI / 3) * 127 + 128);

                return (red << 16) | (green << 8) | (blue << 0)
            }

                    case "color":

                                }

                                if ((matrixDirection == "RIGHT" || matrixDirection == "LEFT") && matrixTheme == "welcome") {
                                    setChar(tmp_y, x, [(tip[ind] ? tip[ind].charCodeAt() : 32) | 0x400000, style, 0], undefined, undefined);
                                } else if (matrixDirection == "RIGHT" || matrixDirection == "LEFT") {
                                    setStyle(tmp_y, x, style);
                                } else {
                                    setStyle(x, tmp_y, style);
                                }
                            }
                        });
                    }
                });

                term.refresh(0, term.rows - 1);
            }

            function onGameData(e) {
                switch (e) {
                    case ESC: // ESC
                    case 'q':
                        isGameStart = false;
                        gameKey = null;
                        term.write('\x1b[!p')
                        gameName = "";
                        initConsole();
                        break;
                    default: //
                        gameKey = e;
                        break;
                }
            }

            function getChar(col, row) {
                return [
                    term._core.buffer.lines._array[row]._data[3 * col],
                    term._core.buffer.lines._array[row]._data[3 * col + 1],
                    term._core.buffer.lines._array[row]._data[3 * col + 2]
                ]
            }

            function getCombined(col, row) {
                let lines = term._core.buffer.lines._array[row];
                if (lines === undefined) {
                    return undefined;
                }
                return lines._combined[col];
            }

            function getExtendedAttrs(col, row) {
                let lines = term._core.buffer.lines._array[row];
                if (lines === undefined) {
                    return undefined;
                }
                return lines._extendedAttrs[col];
            }

            function setChar(col, row, value, combined, extendedAttrs) {
                if (combined != undefined) {
                    term._core.buffer.lines._array[row]._combined[col] = combined;
                } else if (term._core.buffer.lines._array[row]._combined[col]) {
                    delete (term._core.buffer.lines._array[row]._combined[col]);
                }

                if (extendedAttrs != undefined) {
                    term._core.buffer.lines._array[row]._extendedAttrs[col] = extendedAttrs;
                } else if (term._core.buffer.lines._array[row]._extendedAttrs[col]) {
                    delete (term._core.buffer.lines._array[row]._extendedAttrs[col]);
                }

                term._core.buffer.lines._array[row]._data[3 * col] = value[0];
                term._core.buffer.lines._array[row]._data[3 * col + 1] = value[1];
                term._core.buffer.lines._array[row]._data[3 * col + 2] = value[2];
            }

            function setStyle(col, row, style) {
                term._core.buffer.lines._array[row]._data[3 * col + 1] = style;
            }

            function setNormalChar(col, row, value, combinedChar) {
                if (combinedChar != undefined) {
                    term._core.buffer.lines._array[row]._combined[col] = combinedChar;
                } else if (term._core.buffer.lines._array[row]._combined[col]) {
                    delete (term._core.buffer.lines._array[row]._combined[col]);
                }

                term._core.buffer.lines._array[row]._data[3 * col] = value[0];
                term._core.buffer.lines._array[row]._data[3 * col + 1] = value[1];
                term._core.buffer.lines._array[row]._data[3 * col + 2] = value[2];
            }

            function setNormalStyle(col, row, style) {
                term._core.buffer.lines._array[row]._data[3 * col + 1] = style;
            }

            function isEmptyChar(col, row) {
                let line = term.buffer.active.getLine(row);
                if (line == undefined) {
                    return false;
                }
                let cell = line.getCell(col)
                if (cell == undefined) {
                    return false;
                }
                return cell.getChars() == ' ' || cell.getChars() == ''
            }

            function charain() {
                if (!isGameStart || gameName != "charain") {
                    return;
                }
                const keys = [VK_LEFT, VK_RIGHT, VK_DOWN, VK_UP];
                if (keys.includes(consoleKey)) {
                    autoFlag = false;
                }

                if (autoFlag && !changed) {
                    let index = Math.round((Math.random() * keys.length));
                    gameKey = keys[index];
                }
                changed = false;

                for (let k = 0; k < term.rows; k++) {
                    let j = term.rows - 1 - k;
                    for (let i = 0; i < term.cols; i++) {
                        let cur_char = getChar(i, j);
                        let cur_combined = getCombined(i, j);
                        let cur_extendedAttrs = getExtendedAttrs(i, j);

                        if (isEmptyChar(i, j)) {
                            continue;
                        }

                        let ax = i;
                        let ay = j;
                        if (gameKey == null) {
                            continue
                        }

                        switch (gameKey) {
                            case ' ':
                                initGameConsole();
                                gameKey = null;
                                autoFlag = false;
                                break;
                            case ENTER:
                                gameKey = null;
                                autoFlag = !autoFlag;
                                break;
                            case VK_UP:
                            case 'w':
                                ay = j - Math.round(Math.random() * 1);
                                break;
                            case VK_LEFT:
                            case 'a':
                                ax = i - Math.round(Math.random() * 1);
                                break;
                            case VK_RIGHT:
                            case 'd':
                                ax = i + Math.round(Math.random() * 1);
                                break;
                            default:
                            case 's':
                                ay = j + Math.round(Math.random() * 1);
                                break;
                        }

                        let next_char = null;
                        let next_combined = undefined;
                        let next_extendedAttrs = undefined;
                        if (ax >= 0 && ax < term.cols && ay < term.rows && ay >= 0) {
                            next_char = getChar(ax, ay)
                            next_combined = getCombined(ax, ay);
                            next_extendedAttrs = getExtendedAttrs(ax, ay)
                        }

                        if (next_char != null && isEmptyChar(ax, ay)
                            && (j < term.rows)
                            && (i < term.cols)
                            && (i >= 0)) {
                            setChar(ax, ay, cur_char, cur_combined, cur_extendedAttrs);
                            setChar(i, j, next_char, next_combined), next_extendedAttrs;

                            changed = true;

                        }
                    }
                }
                if (changed) {
                    term.refresh(0, term.rows - 1);
                }

            }

            setInterval(matrix, 100);
            setInterval(charain, 2);
            runFakeTerminal();
        });

        function addDecoration(term) {
            const marker = term.addMarker(15);
            const decoration = term.registerDecoration({ marker, x: 44 });
            decoration.onRender(element => {
                element.classList.add('link-hint-decoration');
                element.innerText = 'Try clicking italic text';
                // must be inlined to override inlined width/height coming from xterm
                element.style.height = '';
                element.style.width = '';
            });
        }
