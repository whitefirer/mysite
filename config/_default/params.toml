# Page global config
[page]
  hiddenFromHomePage = false
  hiddenFromSearch = false
  twemoji = false
  lightgallery = false
  ruby = true
  fraction = true
  fontawesome = true
  linkToMarkdown = true
  rssFullText = false
  [page.toc]
    enable = true
    keepStatic = false
    auto = true
  [page.code]
    copy = true
    maxShownLines = 50
  # KaTeX mathematical formulas config
  [page.math]
    enable = false
    inlineLeftDelimiter = ""
    inlineRightDelimiter = ""
    blockLeftDelimiter = ""
    blockRightDelimiter = ""
    copyTex = true
    mhchem = true
  # Mapbox GL JS config
  [page.mapbox]
    accessToken = ""
    lightStyle = "mapbox://styles/mapbox/light-v10?optimize=true"
    darkStyle = "mapbox://styles/mapbox/dark-v10?optimize=true"
    navigation = true
    geolocate = true
    scale = true
    fullscreen = true
  # Social share links in post page
  [page.share]
    enable = true
    Twitter = true
    Facebook = true
    Linkedin = false
    Whatsapp = false
    Pinterest = false
    Tumblr = false
    HackerNews = true
    Reddit = false
    VK = false
    Buffer = false
    Xing = false
    Line = true
    Instapaper = false
    Pocket = false
    Flipboard = false
    Weibo = true
    Wechat = true
    Blogger = false
    Baidu = false
    Odnoklassniki = false
    Evernote = false
    Skype = false
    Trello = false
    Mix = false
  # Comment config
  [page.comment]
    enable = true
    [page.comment.disqus]
      enable = false
      shortname = "whitefirer-org"
    [page.comment.gitalk]
      enable = false
      owner = ""
      repo = ""
      clientId = ""
      clientSecret = ""
    [page.comment.valine]
      enable = false
    [page.comment.waline]
      enable = true
      serverURL = "https://comment.whitefirer.org"
      lang = "zh-CN"
      darkMode = "auto"
      pageSize = 10
      requiredMeta = ["nick", "mail"]
    [page.comment.facebook]
      enable = false
      width = "100%"
      numPosts = 10
      appId = ""
      languageCode = ""
    [page.comment.telegram]
      enable = false
      siteID = ""
      limit = 5
      height = ""
      color = ""
      colorful = true
      dislikes = false
      outlined = false
    [page.comment.commento]
      enable = false
    [page.comment.utterances]
      enable = false
      repo = "whitefirer/whitefirer.github.io"
      issueTerm = "pathname"
      label = ""
      lightTheme = "github-light"
      darkTheme = "github-dark"
    [page.comment.giscus]
      enable = true
      repo = "whitefirer/whitefirer.github.io"
      repoId = "R_kgDOH2gmzQ"
      category = "Comments"
      categoryId = "DIC_kwDOH2gmzc4CQ_fM"
      lang = ""
      mapping = "pathname"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      lazyLoading = true
      lightTheme = "light"
      darkTheme = "dark"
  # Third-party library config
  [page.library]
    [page.library.css]
    [page.library.js]
  # Page SEO config
  [page.seo]
    images = []
    [page.seo.publisher]
      name = ""
      logoUrl = ""

