# Author config
[author]
  name = "whitefirer"
  email = "whitefirer@gmail.com"
  link = "https://whitefirer.org"
# site default theme ["auto", "light", "dark"]
defaultTheme = "auto"
favicon = "avatar.png"
# public git repo url only then enableGitInfo is true
gitRepo = "https://github.com/whitefirer/mysite"
# 微信公众号预览服务地址（hugo server 模式下显示按钮）
wechatPreviewURL = "http://127.0.0.1:3333"
# which hash function used for SRI, when empty, no SRI is used
fingerprint = ""
# date format
dateFormat = "2006-01-02"
# website title for Open Graph and Twitter Cards
title = "赛博闲谭-whitefirer"
# website description for RSS, SEO, Open Graph and Twitter Cards
description = "Welcome to the blog of whitefirer."
# website images for Open Graph and Twitter Cards
images = []

# Header config
[header]
  # desktop header mode ["fixed", "normal", "auto"]
  desktopMode = "fixed"
  # mobile header mode ["fixed", "normal", "auto"]
  mobileMode = "auto"
  [header.title]
    logo = ""
    name = "赛博闲谭-whitefirer"
    pre = ""
    post = ""
    typeit = false

# Footer config
[footer]
  enable = true
  custom = ""
  hugo = true
  copyright = true
  author = true
  since = 2022
  icp = ""
  license= ""

# Section (all posts) page config
[section]
  paginate = 20
  dateFormat = "01-02"
  rss = 10

# List (category or tag) page config
[list]
  paginate = 20
  dateFormat = "01-02"
  rss = 10

# App icon config
[app]
  title = "赛博闲谭-whitefirer"
  noFavicon = false
  svgFavicon = ""
  themeColor = "#ffffff"
  iconColor = "#5bbad5"
  tileColor = "#da532c"

# Search config
[search]
  enable = true
  type = "lunr"
  contentLength = 4000
  placeholder = ""
  maxResultLength = 10
  snippetLength = 30
  highlightTag = "em"
  absoluteURL = false
  [search.algolia]
    index = ""
    appID = ""
    searchKey = ""

# Home page config
[home]
  rss = 10
  [home.profile]
    enable = true
    gravatarEmail = ""
    avatarURL = "/avatar.png"
    title = "whitefirer"
    subtitle = [
      "从云原生到 AI 工程化",
      "Cloud Native × AI Engineering",
      "难度即价值所在",
    ]
    typeit = true
    social = true
    disclaimer = "Aeraki Maintainer · IstioCon 2022"
  [home.posts]
    enable = true
    paginate = 6

